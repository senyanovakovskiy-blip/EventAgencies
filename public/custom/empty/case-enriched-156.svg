<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10192f"/><stop offset=".55" stop-color="#212347"/><stop offset="1" stop-color="#542a4c"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#ff577f" stop-opacity=".8"/><stop offset="1" stop-color="#ff577f" stop-opacity="0"/></radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6b7c"/><stop offset=".48" stop-color="#f7be72"/><stop offset="1" stop-color="#7df0db"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="48"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1210" cy="405" r="250" fill="url(#glow)" filter="url(#blur)"/>
