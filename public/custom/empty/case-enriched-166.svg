<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Авангардисты Владивостока — иллюстрация к кейсу ABC LAB</title>
<desc id="desc">Абстрактный контур прибрежного города, соединяющий людей, культурные точки и открытое голосование; это иллюстрация, не фотография проекта.</desc>
