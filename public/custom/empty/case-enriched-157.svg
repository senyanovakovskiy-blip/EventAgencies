<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ЭКСПО. Территория мечты — иллюстрация к кейсу Oriflame</title>
<desc id="desc">Концептуальный зал с круговым экраном, центральным подиумом и световыми павильонами; это иллюстрация, а не фотография события.</desc>
