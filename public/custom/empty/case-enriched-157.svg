 <radialGradient id="light"><stop stop-color="#f6b85d" stop-opacity=".68"/><stop offset="1" stop-color="#f6b85d" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
