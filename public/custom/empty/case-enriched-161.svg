<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Горы. Звёзды. Разговоры по душам — иллюстрация к кейсу EVENTEX</title>
<desc id="desc">Концептуальный ночной маршрут через горные вершины к месту встречи; это иллюстрация, а не фотография поездки.</desc>
