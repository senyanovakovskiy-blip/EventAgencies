 <radialGradient id="moon"><stop stop-color="#ffd78a" stop-opacity=".7"/><stop offset="1" stop-color="#ffd78a" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
</defs>
