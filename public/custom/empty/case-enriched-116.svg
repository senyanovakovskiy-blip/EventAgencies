<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">«Гонка дронов» — концептуальная иллюстрация</title>
<desc id="desc">Четыре гоночных дрона проходят световую трассу над сценой соревнований, крупные экраны передают вид от первого лица. Концептуальная иллюстрация, не фотография события.</desc>
