<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">Dreamlaser — концептуальная иллюстрация праздничного мэппинга</title>
<desc id="desc">Две стилизованные кремлёвские башни в ночном городе, на фасадах — абстрактные архивные кадры и световые проекции. Иллюстрация создана для каталога, не фотография события.</desc>
