    <radialGradient id="glow"><stop stop-color="#f7c9ff" stop-opacity=".7"/><stop offset=".45" stop-color="#a15cff" stop-opacity=".22"/><stop offset="1" stop-color="#5b35ba" stop-opacity="0"/></radialGradient>
