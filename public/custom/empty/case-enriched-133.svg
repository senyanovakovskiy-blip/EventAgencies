<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Концептуальная иллюстрация «Орбита» на Signal 2024</title>
  <desc id="desc">Символическая иллюстрация: полукруглая сцена Meadow, световые узлы и орбиты. Это концептуальная графика, не фотография события.</desc>
  <defs>
