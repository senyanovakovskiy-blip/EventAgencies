<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Хорошее место — иллюстрация к кейсу Яндекс Карт</title>
<desc id="desc">Абстрактная сиреневая луна над городскими витринами и дорожкой встречи; не фотография события.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d2340"/><stop offset=".55" stop-color="#41345d"/><stop offset="1" stop-color="#af7aa6"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#e4b1ff" stop-opacity=".76"/><stop offset="1" stop-color="#bb8fe9" stop-opacity="0"/></radialGradient>
 <linearGradient id="road" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfa8f4"/><stop offset="1" stop-color="#ffd398"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1182" cy="300" r="255" fill="url(#moon)" filter="url(#blur)"/>
<circle cx="1182" cy="300" r="122" fill="#dcb1f2" opacity=".72"/>
<path d="M0 636h1600v264H0z" fill="#202741" opacity=".74"/>
