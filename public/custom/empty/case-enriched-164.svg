<path d="M574 900q154-201 351-226t367 226" fill="none" stroke="url(#road)" stroke-width="7" opacity=".85"/>
<path d="M709 900q119-130 259-147t257 147" fill="none" stroke="#fff" stroke-opacity=".34" stroke-width="2"/>
<g fill="#fff" opacity=".82"><circle cx="936" cy="422" r="5"/><circle cx="1361" cy="401" r="4"/><circle cx="1490" cy="355" r="3"/><circle cx="904" cy="333" r="4"/></g>
<text x="110" y="151" fill="#d9cde6" font-family="Arial,sans-serif" font-size="22" letter-spacing="5">EVENTUM PREMO · ЯНДЕКС КАРТЫ · МОСКВА</text>
<text x="104" y="350" fill="#fff" font-family="Arial,sans-serif" font-size="61" font-weight="700">ХОРОШЕЕ</text>
<text x="104" y="428" fill="#e3b9fa" font-family="Arial,sans-serif" font-size="68" font-weight="700">МЕСТО</text>
<text x="110" y="499" fill="#eee7f4" font-family="Arial,sans-serif" font-size="25">когда бизнесу говорят: мы вас видим</text>
