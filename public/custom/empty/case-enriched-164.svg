<text x="145" y="657" fill="#fff" font-family="Arial,sans-serif" font-size="23">1 июня 2024 · Академия ВТБ</text>
<text x="110" y="822" fill="#ded9e6" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">ИЛЛЮСТРАЦИЯ · НЕ ФОТО СОБЫТИЯ</text>
</svg>