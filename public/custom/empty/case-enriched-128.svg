<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Фиджитал-баскетбол на «Играх Будущего»</title>
  <desc id="desc">Концептуальный плакат: схема LED-площадки соединяет цифровой баскетбол и матч 2×2. Это иллюстрация, не фотография проекта.</desc>
