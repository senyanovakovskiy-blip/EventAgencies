    <radialGradient id="glow"><stop stop-color="#61f2dd" stop-opacity=".34"/><stop offset="1" stop-color="#61f2dd" stop-opacity="0"/></radialGradient>
    <pattern id="pixels" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#d9fff7" opacity=".18"/></pattern>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#69eee0" stroke-opacity=".14" stroke-width="1"/></pattern>
