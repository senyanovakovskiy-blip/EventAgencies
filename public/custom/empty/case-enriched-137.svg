<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Концептуальная иллюстрация орбиты Т-Банка на ИТ-Пикнике</title>
  <desc id="desc">Условный лабиринт из продуктовых планет, соединённых маршрутом вокруг центральной орбиты. Это концептуальная графика, не фотография стенда.</desc>
