<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">«Мир без слёз» — концептуальная иллюстрация</title>
<desc id="desc">Тёплая комната детской больницы, маленькая сцена, светящиеся звёзды и дружелюбный условный робот рядом с книгой и монетами. Иллюстрация не является фотографией акции.</desc>
